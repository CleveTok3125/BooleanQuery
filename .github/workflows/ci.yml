name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.25', 'stable']
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go }}-

      - name: Build
        run: go build -o bq .

      - name: Vet & format check
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"

      - name: Test with race & coverage
        run: go test -v -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
        env:
          GOFLAGS: -count=1

      - name: Verify tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Benchmark (time + allocs)
        run: go test -bench=. -benchtime=100ms -benchmem ./engine/

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-lint-go-${{ hashFiles('**/go.sum') }}

      - name: Build
        run: go build -o /dev/null .

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
